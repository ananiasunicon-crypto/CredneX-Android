name: Gerar APK CredneX

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        projeto: [admin, client]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      - name: Instalar SDK
        run: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        working-directory: ${{ matrix.projeto }}
        run: gradle assembleDebug

      - name: Preparar APK
        run: |
          mkdir -p dist
          cp "${{ matrix.projeto }}/app/build/outputs/apk/debug/app-debug.apk" "dist/CredneX-${{ matrix.projeto }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: CredneX-${{ matrix.projeto }}
          path: dist/*.apk
